<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Popup</title>
    <style>
      body {
        text-align: center;
        padding-top: 100px;
        font-family: sans-serif;
      }

      button {
        padding: 12px 24px;
        font-size: 18px;
        cursor: pointer;
      }

      #message {
        display: none;
        margin: 30px auto;
        padding: 24px;
        max-width: 300px;
        color: white;
        background: #4f46e5;
        border-radius: 16px;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Mobile Test!</h1>
    <p>Live from my PC</p>

    <button id="helloButton">Show Message</button>

    <div id="message">
      Hello!<br />
      You can do it! 🎉
    </div>

    <script>
      const button = document.getElementById("helloButton");
      const message = document.getElementById("message");

      button.addEventListener("click", () => {
        message.style.display = "block";
      });
    </script>
  </body>
</html>
